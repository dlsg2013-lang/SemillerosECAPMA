17;Semillas e Innovación - Sei;SEI;"Nuestra misión es promover el conocimiento y la innovación en el área de semillas, a través de la investigación colaborativa y la formación integral de estudiantes de la ECAPMA. Nos comprometemos a: 1. Investigar y desarrollar prácticas sostenibles en la producción, conservación y mejoramiento de semillas, contribuyendo a la seguridad alimentaria y la biodiversidad. 2. Fomentar el aprendizaje práctico y teórico, proporcionando a los estudiantes herramientas y experiencias que les permitan convertirse en profesionales competentes y responsables en el manejo de recursos genéticos. 3. Colaborar con comunidades y productores locales para identificar necesidades y desarrollar soluciones adaptadas a sus contextos, promoviendo el desarrollo rural sostenible. 4. Divulgar nuestros hallazgos y experiencias a través de publicaciones, talleres y eventos, fortaleciendo la transferencia de conocimiento hacia la comunidad académica y el sector agrícola. 5. Crear un ambiente de trabajo inclusivo y motivador, donde se valore la diversidad de ideas y se fomente la creatividad y la innovación entre todos los participantes.

28;Semillero de Investigación Rural en Sostenibilidad Humana e Identidad;SIRUSHI;El Semillero de Investigación Rural en Sostenibilidad Humana e Identidad (SIRUSHI) tiene como misión promover un desarrollo rural sostenible a través de investigaciones interdisciplinarias de alta calidad. Nos dedicamos a fortalecer la resiliencia, mejorar el bienestar humano y preservar la identidad cultural de las comunidades rurales. Integrando rigurosamente conocimientos científicos y saberes locales, aspiramos a generar soluciones inclusivas y sostenibles que enfrenten los desafíos contemporáneos del entorno rural. Nuestro enfoque ontológico nos permite profundizar en la comprensión del ser y del hacer de los hombres y mujeres rurales, así como de su relación con la agricultura y el entorno natural.;El Semillero de Investigación Rural en Sostenibilidad Humana e Identidad (SIRUSHI) se proyecta como un referente académico y científico en el ámbito del desarrollo rural sostenible. Nuestro objetivo es consolidarnos como un espacio de excelencia y colaboración académica, donde converjan estudiantes, investigadores y comunidades para generar conocimientos y prácticas que promuevan un futuro equitativo y sostenible, fundamentado en la identidad y el bienestar humano de las comunidades rurales. Desde una perspectiva ontológica, buscamos comprender y valorar la esencia del ser rural, la relación intrínseca con la agricultura y la forma en que estas identidades rurales se reconstruyen y adaptan en un contexto en constante cambio.;Semillero de exploración;Zona Centro Oriente (Zcori);Agronomia;Competencias personales y desarrollo;El Semillero de Investigación Rural en Sostenibilidad Humana e Identidad (SIRUSHI) tiene como objetivo general promover la investigación interdisciplinaria y la generación de conocimiento en torno al desarrollo rural sostenible. A través de un enfoque ontológico, buscamos comprender y valorar la esencia del ser rural, la relación intrínseca con la agricultura y la forma en que las identidades rurales se reconstruyen y adaptan en un contexto en constante cambio. Nos proponemos ser una herramienta clave para que el hombre y la mujer rurales se encuentren como ser siendo, explorando su identidad y alcanzando sus objetivos personales y comunitarios. Nuestro propósito es fortalecer la resiliencia, mejorar el bienestar humano y preservar la identidad cultural de las comunidades rurales, integrando rigurosamente conocimientos científicos y saberes locales para generar soluciones inclusivas y sostenibles que respondan a los desafíos contemporáneos del entorno rural.;OMAR FRANCISCO BARRERA COBOS;"omar.barrera@unad.edu.co; omar-barrera@hotmail.com; o.barreracobos@gmail.com";Cidagro;COL0151671;Ciencias Agrícolas - Otras Ciencias Agrícolas (Semillero de Investigación Rural en Sostenibilidad Humana e Identidad), ;" Objetivo 4: Educación de calidad; Objetivo 5: Igualdad de Género; Objetivo 8: Trabajo decente ";Zona Centro Oriente (Zcori)

        // ==========================================

        const parseCSV = (text, cadena) => {
            if (!text || text.trim() === '' || text.includes('PEGA AQUÍ')) return [];
            
            const firstLine = text.split('\n')[0];
            const delimiter = firstLine.includes(';') ? ';' : ',';

            const result = [];
            let row = [];
            let inQuotes = false;
            let currentValue = '';
            let headers = [];
            let isHeader = true;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        currentValue += '"';
                        i++; 
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === delimiter && !inQuotes) {
                    row.push(currentValue.trim());
                    currentValue = '';
                } else if ((char === '\n' || (char === '\r' && nextChar === '\n')) && !inQuotes) {
                    if (char === '\r') i++; 
                    row.push(currentValue.trim());
                    
                    if (isHeader) {
                        headers = row.map(h => h.replace(/^"|"$/g, '').trim());
                        headers = headers.map(h => h === 'Número' || h === '' ? 'Numero' : h);
                        isHeader = false;
                    } else if (row.length > 1 || row[0] !== '') {
                        let obj = { Cadena: cadena }; 
                        headers.forEach((h, index) => {
                            if(h) obj[h] = row[index] ? row[index].replace(/^"|"$/g, '').trim() : '';
                        });
                        if (obj['Nombre Semillero']) result.push(obj);
                    }
                    row = [];
                    currentValue = '';
                } else {
                    currentValue += char;
                }
            }
            
            if (currentValue || row.length > 0) {
                row.push(currentValue.trim());
                if (!isHeader && (row.length > 1 || row[0] !== '')) {
                    let obj = { Cadena: cadena };
                    headers.forEach((h, index) => {
                         if(h) obj[h] = row[index] ? row[index].replace(/^"|"$/g, '').trim() : '';
                    });
                    if (obj['Nombre Semillero']) result.push(obj);
                }
            }
            return result;
        };

                                                    <a href={`mailto:${selectedSemillero['Correo propietario'].split(';')[0]}`} className="inline-block mt-2 text-adobe-1 text-sm font-medium hover:underline break-all">
                                                        {selectedSemillero['Correo propietario']}
                                                    </a>
                                                </div>
                                            </div>

                                            <hr className="border-gray-100" />

                                            <div>
                                                <h3 className="text-sm font-semibold text-adobe-3 uppercase tracking-wider mb-4 flex items-center">
                                                    <Icons.Link /> Vinculación
                                                </h3>
                                                <div className="space-y-4">
                                                    <div>
                                                        <div className="text-xs text-adobe-4 font-medium mb-1">Grupo de Investigación</div>
                                                        <div className="text-sm font-semibold text-adobe-3 leading-tight">{selectedSemillero['Nombre Grupo']}</div>
                                                    </div>
                                                    <div>
                                                        <div className="text-xs text-adobe-4 font-medium mb-1">Código GrupLAC</div>
                                                        <div className="text-sm font-mono bg-adobe-5 text-adobe-3 px-2 py-1 rounded inline-block">
                                                            {selectedSemillero['Codigo GrupoLac'] || 'N/A'}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <hr className="border-gray-100" />

                                            <div className="space-y-4">
                                                <div>
                                                    <h3 className="text-xs font-semibold text-adobe-4 uppercase tracking-wider mb-1">Clasificación CINE</h3>
                                                    <p className="text-sm font-medium text-adobe-3">{selectedSemillero['Clasificación Internacional Normalizada de la Educación(CINE)'] || 'N/A'}</p>
                                                </div>
                                                <div>
                                                    <h3 className="text-xs font-semibold text-adobe-4 uppercase tracking-wider mb-1">Áreas de Conocimiento</h3>
                                                    <p className="text-sm font-medium text-adobe-3">{selectedSemillero['Áreas de conocimiento'] || 'N/A'}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                {/* Footer Modal */}
                                <div className="px-8 py-6 bg-gray-50 border-t border-gray-100 flex justify-end">
                                    <button 
                                        onClick={() => setSelectedSemillero(null)}
                                        className="px-6 py-2 bg-adobe-1 text-white rounded-full text-sm font-medium hover:opacity-90 transition-opacity"
                                    >
                                        Cerrar ficha
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
